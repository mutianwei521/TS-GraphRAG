# Frozen EXA7 reference settings. Paths resolve relative to this YAML file.
network:
  inp_file: data/Exa7.inp
  name: EXA7

partitioning:
  algorithm: leiden
  num_partitions: 15

sensor_placement:
  sensors_per_partition: 2
  total_sensors: 30
  # Sensor identities and vector order come from paths.fingerprints.

knowledge_base:
  output_dir: knowledge_base
  nodes_per_partition: 2
  leak_rates_Ls: [2, 5, 10, 20, 35, 50]
  demand_periods:
    - name: night_low
      multiplier: 0.7
    - name: day_normal
      multiplier: 1.0
    - name: evening_peak
      multiplier: 1.2

paths:
  fingerprints: data/reference/sensor_fingerprints.json
  query_manifest: reproducibility/queries/reference540.csv
  output_dir: results/evaluation

inference:
  method: projection
  beta: 0.0

evaluation:
  protocol: H0
  seed: 41
  noise_sigma: 0.02
