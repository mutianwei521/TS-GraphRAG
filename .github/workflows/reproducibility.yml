name: Reproducibility checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  core-reproduction:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements-core.lock.txt
      - run: python -m pip install -r requirements-core.lock.txt
      - run: python -m pytest tests -q
      - run: python scripts/reproduce.py --profile smoke --output-dir outputs/ci_smoke
      - run: python scripts/verify_outputs.py --run-dir outputs/ci_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduction-report
          path: outputs/ci_smoke
